[project]
name = "vidctx"
version = "0.1.0"
description = "Turn a video (local file or YouTube URL) into timestamped stills + narration for an LLM to read"
requires-python = ">=3.11,<3.14"
dependencies = [
    "parakeet-mlx>=0.5.2",
    "numpy",
    "yt-dlp[default]",
]

[project.scripts]
vidctx = "vidctx.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
